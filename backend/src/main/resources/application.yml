# ===================================================================
#  공용 설정 (모든 환경에서 사용)
# ===================================================================

server:
  port: 8080
  address: 0.0.0.0
  tomcat:
    connection-timeout: 300000 # 300초
    max-http-form-post-size: 128MB
    max-swallow-size: 128MB

# === 데이터베이스(DB) 설정 ===
# H2 DB로 연결되는 문제를 해결하기 위해 RDS(MySQL) 설정을 명시적으로 추가
# .env 파일의 변수(${DB_URL} 등)를 참조함
spring:
  # 기본 프로필을 'local'으로 설정. 다른 프로필이 지정되면 무시됨.
  profiles:
    default: local
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

  servlet:
    multipart:
      max-file-size: 128MB # 허용할 파일 업로드 최대 크기 (128MB, 필요시 더 크게)
      max-request-size: 128MB # 한 번의 요청으로 허용할 최대 크기 (128MB, 필요시 더 크게)

  # 공용 데이터소스 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL 드라이버
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # DB 연결의 최대 수명 시간을 설정합니다. (단위: 밀리초, ms)
      max-lifetime: 20000000
      # RDS 프리티어 커넥션 문제 해결을 위해 서버가 점유하는 풀 크기 제한
      maximum-pool-size: 5
      # 최소한으로 유지할 커넥션 수 (기본값은 maximum-pool-size와 동일)
      minimum-idle: 2

  # === JPA 설정 ===
  jpa:
    # 성능 향상을 위해 false로 설정
    open-in-view: false
    hibernate:
      # 공통 ddl-auto는 여기서 관리 (prod에서 실수로 update/create 되는 것을 방지)
      ddl-auto: none
    properties:
      hibernate:
        # MySQL 8+ 버전 호환용 Dialect(방언) 설정
        dialect: org.hibernate.dialect.MySQLDialect

  # === Spring Security (OAuth2) ===
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          naver:
            client-id: ${NAVER_OAUTH_CLIENT_ID}
            client-secret: ${NAVER_OAUTH_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
            scope:
              - name
              - email
            client-name: Naver

          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
            scope:
              - account_email
            client-name: Kakao

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize?prompt=login
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# === JWT 설정 ===
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 1800 # 30분
  refresh-token-validity-in-seconds: 2592000 # 30일

# ★ SendGrid API 키 설정 추가 (환경 변수에서 읽어옴)
sendgrid:
  api-key: ${SENDGRID_API_KEY}

# === Swagger (Springdoc) ===
springdoc:
  api-docs:
    path: /api-docs
    enabled: true # 모든 프로필에서 API 문서 활성화
  swagger-ui:
    path: /swagger-ui.html
    enabled: true # 모든 프로필에서 Swagger UI 활성화
    display-request-duration: true
  paths-to-match:
    - /api/**
  info: # New section
    version: v1.0.0

info:
  title: Hire-Picker API
  description: 구인구직 사이트 Hire-Picker 프로젝트 API 명세서
  version: v1.0.0

rapidapi:
  jobsdb:
    key: ${RAPIDAPI_JOBSDB_KEY}
    host: active-jobs-db.p.rapidapi.com
    endpoint: active-ats-7d
    limit: 100
    offset: 0
    page-count: 10
    sort-by: DATE
    order: DESC
    title-filter: "\"Data Engineer\""
    location-filter: "\"United States\" OR \"United Kingdom\""
  jsearch:
    key: ${RAPIDAPI_JSEARCH_KEY}
    host: jsearch.p.rapidapi.com
    query: "developer jobs in chicago"
    country: us
    language: en
    date-posted: all
    page: 1
    num-pages: 5
# === 로깅 설정 ===
logging:
  level:
    root: INFO
    org.springframework.security: INFO
    # CustomAuthenticationProvider 사용 시 발생하는 UserDetailsService 경고(WARN) 로그 끄기
    "org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer": ERROR

# === 외부 API 키 ===
# [추가됨] .env 파일의 API 키들을 Spring에서 쉽게 주입받아 사용하기 위한 설정
api:
  work24:
    key: ${work24_key}

  # 학교 정보 API 키 (커리어넷)
  school-key: ${school_key}

  # 자격증 정보 API 키 (Q-Net)
  certification-key: ${certification_key}

  payment:
    toss:
      widget-secret-key: ${TOSS_WIDGET_SECRET_KEY}
      api-secret-key: ${TOSS_API_SECRET_KEY}
      client-key: ${NEXT_PUBLIC_TOSS_CLIENT_KEY}
      api-url: "https://api.tosspayments.com"

  # Gemini API Key
  gemini:
    api:
      key: ${GOOGLE_API_KEY}
management:
  endpoints:
    web:
      exposure:
        include: "*" # 모든 엔드포인트 노출 (개발용)
  endpoint:
    health:
      show-details: always # /health 엔드포인트에 세부 정보 표시

---
# ===================================================================
#  'local' 프로필 전용 설정 (개발용)
# ===================================================================
spring:
  config:
    activate:
      on-profile: "local"
  # 로컬 H2 파일 DB로 데이터소스 설정 (서버 재기동 시에도 가입/결제 데이터 보존)
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./db/hirepicker;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  # H2 DB 웹 콘솔 활성화
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update # 로컬 구동 시 엔티티 변경사항 자동 생성
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect # H2 Dialect 사용
        format_sql: true
        show_sql: true

---
# ===================================================================
#  'prod' 프로필 전용 설정 (배포용)
# ===================================================================
spring:
  config:
    activate:
      on-profile: "prod"
  data:
    redis:
      repositories:
        enabled: false # Redis 리포지토리 자동 생성 기능 비활성화
  jpa:
    hibernate:
      ddl-auto: none # [수정됨] prod 환경에서도 ddl-auto는 none 또는 validate 권장
    properties:
      hibernate:
        format_sql: false
        show_sql: false

# 시스템 메트릭 바인더 비활성화 (기존 설정 유지)
management:
  metrics:
    binders:
      "system":
        enabled: false
